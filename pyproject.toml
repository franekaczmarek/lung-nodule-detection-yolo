[project]
name = "lung-nodule-detection"
version = "1.0.0"
description = "YOLO pipelines for lung nodule detection in CT scans (LIDC-IDRI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "opencv-python", "SimpleITK", "lungmask", "ultralytics"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lung_nodule_detection"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
